services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    networks:
      - backend
    # Keep Redis private. For local development only, add:
    # ports:
    #   - "127.0.0.1:6379:6379"

networks:
  backend:
    internal: true

volumes:
  redis-data:
