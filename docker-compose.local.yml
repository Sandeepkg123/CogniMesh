name: cognimesh-local

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    env_file: ./backend/gateway/.env
    environment:
      # Listen on 80 inside the container so nginx's `proxy_pass http://gateway;`
      # works unchanged. Production ACA ingress maps 80 -> 8000 the same way.
      PORT: 80
      AUTH_SERVICE: http://auth:8001
      CHAT_SERVICE: http://chat:8002
      AGENT_SERVICE: http://agent:8003
      BILLING_SERVICE: http://billing:8004
      FRONTEND_URL: http://localhost:8080
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: ./backend
      dockerfile: services/auth/Dockerfile
    env_file: ./backend/services/auth/.env
    environment:
      PORT: 8001
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy

  chat:
    build:
      context: ./backend
      dockerfile: services/chat/Dockerfile
    env_file: ./backend/services/chat/.env
    environment:
      PORT: 8002

  agent:
    build:
      context: ./backend
      dockerfile: services/agent/Dockerfile
    env_file: ./backend/services/agent/.env
    environment:
      PORT: 8003
      AUTH_SERVICE: http://auth:8001
      CHAT_SERVICE: http://chat:8002
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - redis
      - auth
      - chat

  billing:
    build:
      context: ./backend
      dockerfile: services/billing/Dockerfile
    env_file: ./backend/services/billing/.env
    environment:
      PORT: 8004
      AUTH_SERVICE: http://auth:8001
    depends_on:
      - auth

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  redis-data:
