name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cognimesh-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: backend/gateway/Dockerfile
          - service: auth
            dockerfile: backend/services/auth/Dockerfile
          - service: chat
            dockerfile: backend/services/chat/Dockerfile
          - service: agent
            dockerfile: backend/services/agent/Dockerfile
          - service: billing
            dockerfile: backend/services/billing/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/cognimesh/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/cognimesh/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/cognimesh/frontend:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/cognimesh/frontend:latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Update Container Apps
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Assert Azure security configuration
        shell: bash
        run: |
          set -euo pipefail

          # All backend services, including the gateway, stay on internal
          # ingress. The frontend nginx container is the only public entry
          # point and proxies /api/ to the gateway over the ACA internal
          # network.
          for app in gateway auth chat billing agent; do
            external=$(az containerapp show \
              --name "$app" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.external \
              -o tsv)

            if [ "$external" != "false" ]; then
              echo "::error::$app must use internal-only ingress"
              exit 1
            fi

            token_ref=$(az containerapp show \
              --name "$app" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='INTERNAL_SERVICE_TOKEN'] | [0].secretRef" \
              -o tsv)

            if [ -z "$token_ref" ]; then
              echo "::error::$app is missing INTERNAL_SERVICE_TOKEN"
              exit 1
            fi
          done

          frontend_external=$(az containerapp show \
            --name frontend \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.external \
            -o tsv)

          if [ "$frontend_external" != "true" ]; then
            echo "::error::frontend must remain externally reachable"
            exit 1
          fi

      - name: Update backend apps
        shell: bash
        run: |
          set -euo pipefail

          # Deploy the gateway first. The new gateway already sends the
          # internal token and strips browser-supplied identity headers, while
          # the old services ignore the token. This avoids an outage window
          # where new services reject traffic from the old gateway.
          for app in gateway auth billing chat agent; do
            az containerapp update \
              --name "$app" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$ACR_NAME.azurecr.io/cognimesh/$app:${{ github.sha }}" \
              --only-show-errors
          done

      - name: Update frontend app
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name frontend \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/cognimesh/frontend:${{ github.sha }}" \
            --only-show-errors
